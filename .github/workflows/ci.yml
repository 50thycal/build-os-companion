name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite and --experimental-strip-types both need a recent 22.x.
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  contracts:
    # The offline half of the contract check runs in `npm test`. This is the half that notices
    # `50thycal/build-os` moving, and it is allowed to fail without blocking a merge: a protocol
    # change upstream is news, not a broken build.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: node scripts/check-contracts.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
